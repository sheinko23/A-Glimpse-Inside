<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Glimpse Inside</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#9bbc0f;--panel:#8bac0f;--ink:#0f380f;--a1:#306230;--a2:#0f380f;--a3:#0f380f;--on:#9bbc0f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1033;--panel:#2b1b57;--ink:#fff3d6;--a1:#ff4fa3;--a2:#38e8ff;--a3:#ffd84a;--on:#1a1033}}
:root[data-theme="dark"]{--bg:#1a1033;--panel:#2b1b57;--ink:#fff3d6;--a1:#ff4fa3;--a2:#38e8ff;--a3:#ffd84a;--on:#1a1033}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:12px/1.9 "Press Start 2P","Courier New",monospace}
.wrap{max-width:560px;margin:0 auto;padding:18px 14px 40px}
.crt{position:relative;background:var(--panel);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--a1);padding:18px}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.1) 0 1px,transparent 1px 3px)}
h1{font-size:clamp(18px,6vw,28px);line-height:1.35;margin:0 0 6px;color:var(--a2);text-shadow:3px 3px 0 var(--a1)}
h2{font-size:15px;line-height:1.6;margin:0 0 10px;color:var(--a3);text-shadow:2px 2px 0 var(--a1)}
p{margin:0 0 12px}
#hud{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px;border-bottom:4px solid var(--ink);padding-bottom:8px}
#hud b{color:var(--a3)}
#play{position:relative;margin:0 auto;max-width:340px}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
button{font:inherit;color:var(--ink);cursor:pointer}
.cell{aspect-ratio:1;font-size:30px;background:var(--bg);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--a1)}
.cell:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--a1)}
.cell.done{opacity:.3;box-shadow:none}
.cell.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn{display:block;width:100%;text-align:left;padding:12px;margin-top:10px;background:var(--a2);color:var(--on);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--a1);line-height:1.6}
.btn:hover{background:var(--a1);color:var(--on)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--a1)}
button:focus-visible{outline:4px dashed var(--a3);outline-offset:3px}
.wh{position:absolute;z-index:3;pointer-events:none;font-size:11px;color:var(--a1);background:var(--panel);padding:2px 6px;border:2px solid var(--a1);animation:fd 1.7s forwards}
@keyframes fd{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.hint{background:var(--a3);color:var(--on);border:4px solid var(--ink);padding:8px;margin-bottom:12px;font-size:11px}
.blink{animation:bl 1s steps(2) infinite;color:var(--a3)}
@keyframes bl{50%{opacity:0}}
.row{margin-bottom:10px}
.bar{height:16px;background:var(--bg);border:3px solid var(--ink)}
.bar i{display:block;height:100%;background:var(--a1)}
.sm{font-size:10px}
.ok{color:var(--a3)}
footer{margin-top:16px;font-size:10px;line-height:1.8;opacity:.85}
@media (prefers-reduced-motion:reduce){.blink,.cell.shake,.wh{animation:none}.wh{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
<div class="crt">
<h1>A Glimpse Inside</h1>
<div id="hud" hidden><span>LEVEL <b id="lv">1</b></span><span>TIME <b id="tm">0.0</b></span><span>OOPS <b id="ms">0</b></span></div>
<main id="app"></main>
</div>
<footer>v2, v1 was really buggy so I cant show that (guys im sleep deprived because of this 🫩). Made by Shein, yours truly. If you or someone you know is struggling, call or text 988 or maybe contact a therapist. 🤷.</footer>
</div>
<script>
const R=[
{n:"Baseline",b:"Nothing too hard just click on the numbers in order. How hard could that be right?"},
{n:"The Whispers",b:"Some uninvited voices join the party. Do not listen to them. They give terrible advice and they are rude :( ",k:"Hallucination",d:"Hearing or seeing things that are not really there is called a hallucination. It is a positive symptom, which means something extra gets added."},
{n:"Wobbly Numbers",b:"Some numbers are real some are just your brain doing tricks on you so bewary :).",k:"Perceptual distortion",d:"Real things can look or sound off, so you cannot fully trust what you perceive."},
{n:"A Little Helper",b:"A very confident hint shows up. It is wrong. Every single time. If you fall for that yeah just exit the game.",k:"Delusion",d:"A delusion is a false belief that sticks around even when the evidence says otherwise. The hint felt helpful and was still wrong."}
];
const QUIP=["No notes.","Okay that got louder than expected.","Your numbers lied to you and you still won."];
const WH=["are you stupid?","WRONG ONE","behind you","nice try","you sure about that one bro?","they know","wrong again you cant do anything right","ugly","loser","you're being watched"];
const Q=[
{q:"Schizophrenia means a person has multiple personalities.",a:"myth",e:"That mixup is with dissociative identity disorder, which is a different condition. Schizophrenia affects how someone perceives and thinks."},
{q:"Most people with schizophrenia are violent.",a:"myth",e:"Most are not violent, and they are more likely to be victims of violence than to cause it. Movies really did them dirty."},
{q:"Medication, therapy, and support can help people manage schizophrenia.",a:"fact",e:"Y Treatment works best when all three show up together, like a really good group project (rare, I know)."}
];
const $=q=>document.querySelector(q),app=$("#app"),T=[];
const rnd=n=>Math.floor(Math.random()*n);
const clr=()=>{T.forEach(clearInterval);T.length=0};
let rs,cur,next,errs,t0;
function title(){
clr();rs=[];$("#hud").hidden=true;
app.innerHTML=`<p class="sm">A psychotic disorder made into a game</p><p>Click on the numbers in order from 1-9, every level will change up to represent the exprencies of SCHIZOPHRENIA. </p><p class="blink">INSERT TOKEN</p><button class="btn" id="go">PRESS START</button>`;
$("#go").onclick=()=>intro(0);
}
function intro(i){
clr();$("#hud").hidden=true;
const prev=i>0?`<p class="ok">Level ${i} cleared. ${rs[i-1].t.toFixed(1)} seconds and ${rs[i-1].e} oops. ${QUIP[i-1]}</p>`:"";
app.innerHTML=`${prev}<h2>LEVEL ${i+1}: ${R[i].n}</h2><p>${R[i].b}</p><button class="btn" id="go">GO</button>`;
$("#go").onclick=()=>play(i);
}
function play(i){
cur=i;next=1;errs=0;
$("#hud").hidden=false;$("#lv").textContent=i+1;$("#ms").textContent=0;$("#tm").textContent="0.0";
const nums=[1,2,3,4,5,6,7,8,9].sort(()=>Math.random()-.5);
app.innerHTML=`<div id="play"><div class="hint" id="hint" hidden></div><div id="grid">${nums.map(n=>`<button class="cell" data-n="${n}">${n}</button>`).join("")}</div></div>`;
const grid=$("#grid"),pl=$("#play");
grid.querySelectorAll(".cell").forEach(c=>c.onclick=()=>{
if(+c.dataset.n==next){c.classList.add("done");c.disabled=true;next++;if(next>9)done();}
else{errs++;$("#ms").textContent=errs;c.classList.add("shake");setTimeout(()=>c.classList.remove("shake"),300);}
});
t0=performance.now();
T.push(setInterval(()=>{$("#tm").textContent=((performance.now()-t0)/1000).toFixed(1)},100));
if(i>=1)T.push(setInterval(()=>{
const w=document.createElement("span");w.className="wh";w.textContent=WH[rnd(WH.length)];
w.style.left=(rnd(60)+5)+"%";w.style.top=(rnd(85)+5)+"%";pl.appendChild(w);setTimeout(()=>w.remove(),1700);
},1000));
if(i>=2)T.push(setInterval(()=>{
const cs=[...grid.children].filter(c=>!c.disabled);if(!cs.length)return;
const c=cs[rnd(cs.length)],real=c.dataset.n;let f;do{f=1+rnd(9)}while(f==real);
c.textContent=f;setTimeout(()=>{c.textContent=real},380);
},700));
if(i>=3)T.push(setInterval(()=>{
let w;do{w=1+rnd(9)}while(w==next);
const h=$("#hint");if(!h)return;h.textContent=`HINT (trust me bro): click ${w} next`;h.hidden=false;setTimeout(()=>{h.hidden=true},1700);
},2600));
}
function done(){
clr();rs.push({t:(performance.now()-t0)/1000,e:errs});
cur<3?intro(cur+1):results();
}
function results(){
$("#hud").hidden=true;
const m=Math.max(...rs.map(r=>r.t));
const pct=Math.round((rs[3].t/rs[0].t-1)*100);
const cmp=pct>0?`Level 4 took ${pct} percent longer than level 1. Same nine numbers. Way more chaos.`:`You actually got faster, which is impressive. Most people slow down once the noise kicks in.`;
app.innerHTML=`<h2>GAME OVERRRRR now do the quiz..</h2><p>The fake helper has been fired. Here is how your brain handled each level.</p>${rs.map((r,i)=>`<div class="row"><div class="sm">Level ${i+1}: ${R[i].n}</div><div class="bar"><i style="width:${r.t/m*100}%"></i></div><div class="sm">${r.t.toFixed(1)} seconds, ${r.e} oops</div></div>`).join("")}<p>${cmp}</p>${[1,2,3].map(i=>`<p class="sm"><b class="ok">Level ${i+1} was a ${R[i].k}.</b> ${R[i].d}</p>`).join("")}<button class="btn" id="go">ON TO THE QUIZ</button>`;
$("#go").onclick=()=>quiz(0,0);
}
function quiz(i,s){
if(i==Q.length)return fin(s);
app.innerHTML=`<h2>MYTH OR FACT? (${i+1} of ${Q.length})</h2><p>${Q[i].q}</p><button class="btn" data-a="myth">MYTH</button><button class="btn" data-a="fact">FACT</button>`;
app.querySelectorAll(".btn").forEach(b=>b.onclick=()=>{
const ok=b.dataset.a==Q[i].a;
app.innerHTML=`<h2>${ok?"CORRECT":"NOT QUITE"}</h2><p>It is a ${Q[i].a}. ${Q[i].e}</p><button class="btn" id="nx">NEXT</button>`;
$("#nx").onclick=()=>quiz(i+1,s+(ok?1:0));
});
}
function fin(s){
const g=s==3?"Nice job you know your stuff.":s==2?"A solid B plus. Respectable.":"Eh pretty mid, atleast you learned something.";
app.innerHTML=`<h2>FINAL SCORE: ${s} OF 3</h2><p class="ok">${g}</p><p>So this was a small example obviously not the real thing. Schizophrenia is treatable, and people with it live full lives when they get good treatment and support.</p><p>The real fight is stigma, and you just helped beat it a little by learning this.</p><button class="btn" id="go">PLAY AGAIN</button>`;
$("#go").onclick=title;
}
title();
</script>
</body>
</html>
